<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>greenhub sign in</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="greenhub-v1.2.css"></head><body class="login-page"><main class="login-card account-login-card"><a class="login-brand" href="index.html">greenhub</a><div class="auth-tabs"><button id="signInTab" class="auth-tab active" type="button">Sign in</button><button id="createAccountTab" class="auth-tab" type="button">Create new account</button></div><section id="signInPanel"><h1>Welcome back</h1><p>Sign in to manage your profile and plants.</p><form id="loginForm"><label>Username<input id="username" type="text" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">Sign in</button><small id="loginMessage" class="form-message"></small></form></section><section id="createAccountPanel" class="hidden"><h1>Create account</h1><p>This v1.2 test account is stored only in this browser. No payment details are required.</p><form id="createAccountForm"><label>Display name<input id="newDisplayName" type="text" required></label><label>Username<input id="newUsername" type="text" minlength="3" required></label><label>Email<input id="newEmail" type="email" required></label><label>Location<select id="newLocation"><option>Larnaca</option><option>Nicosia</option><option>Limassol</option><option>Paphos</option><option>Famagusta</option></select></label><label>Password<input id="newPassword" type="password" minlength="4" required></label><label>Confirm password<input id="confirmPassword" type="password" minlength="4" required></label><button type="submit">Create account</button><small id="createAccountMessage" class="form-message"></small></form><p class="prototype-security-note"><strong>Prototype only:</strong> use a throwaway test password. Account data is stored in this browser.</p></section></main><script src="login.js"></script></body></html>
