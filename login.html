<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>greenhub login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-page">
  <main class="login-wrapper">
    <section class="login-card">
      <p class="eyebrow">greenhub by agrologic</p>
      <h1>Sign in</h1>
      <p class="login-note">Access your agricultural workspace.</p>

      <form id="loginForm">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />

        <p id="loginMessage" class="login-message"></p>
        <button type="submit" class="main-button full-width">Enter greenhub</button>
      </form>

      <a class="back-link" href="index.html">← Back to agrologic</a>
    </section>
  </main>

  <script src="login.js"></script>
</body>
</html>
