<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>greenhub login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">
  <main class="login-card">
    <h1>greenhub</h1>
    <p>Sign in to continue</p>
    <form id="loginForm">
      <input id="username" type="text" placeholder="Username" autocomplete="username" required />
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required />
      <button type="submit">Sign in</button>
      <small id="loginMessage"></small>
    </form>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const message = document.getElementById('loginMessage');
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      if ((user === 'admin' || user === 'zacharias') && pass === 'greenhub') {
        window.location.href = 'greenhub.html';
      } else {
        message.textContent = 'Wrong username or password.';
      }
    });
  </script>
</body>
</html>
