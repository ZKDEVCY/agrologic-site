name: AgroMet Live weather observations
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: agromet-station-update
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve and normalize official observations
        run: python scripts/update_agromet.py
      - name: Publish station snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agromet/stations.json
          if ! git diff --cached --quiet; then
            git commit -m "Update AgroMet Live station observations"
            git push
          fi
